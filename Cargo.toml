[package]
name = "lilbox"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A lil exe.dev you run on your own box"

[[bin]]
name = "lilbox"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures = "0.3"
microsandbox = { version = "0.6.8", default-features = false, features = ["net", "prebuilt", "ssh"] }
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
toml = "0.9"

[profile.release]
strip = true
lto = "thin"
