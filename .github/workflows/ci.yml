name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        # microsandbox's VMM (msb-krun -> caps/capng) links against libcap-ng,
        # which isn't preinstalled on the GitHub runner.
        run: sudo apt-get update && sudo apt-get install -y libcap-ng-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt -- --check
      - name: Check
        run: cargo check --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked

# The live end-to-end smoke test needs a KVM host, so it remains a manual or
# self-hosted-runner check (`lilbox doctor` must pass).
